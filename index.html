<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
        <h1>Valor Futuro</h1>
        <form id="form">
            <div>
                <label for="parcela">Valor da Parcela em reais</label>
                <input type="number" id="parcela" min="0" step="0.01" required>
            </div>
            <div>
                <label for="taxa">Taxa de Juros % ao mês</label>
                <input type="number" id="taxa" min="0" step="0.01" required>
            </div>
            <div>
                <label for="tempo">Tempo em meses</label>
                <input type="number" id="tempo" min="1" required>
            </div>
            <button type="submit">Calcular</button>
        </form>
        <div id="resultado" class="resultado" style="display: none;"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
